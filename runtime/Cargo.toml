[package]
name = "graft-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
prost = "0.14"
rayon = "1.12"
tract-onnx = { version = "0.23.6", default-features = false }
# tract-onnx depends on the same tract-linalg release. This direct dependency
# enables tract's Rayon-backed kernels through Cargo feature unification.
tract-linalg = { version = "0.23.6", default-features = false, features = ["multithread-mm"] }

[profile.release]
# Inference is compute-bound inside the embedded module. Optimize for speed;
# binary size is secondary for a library that embeds tract's operator set.
opt-level = 3
lto = true
codegen-units = 1
strip = true
